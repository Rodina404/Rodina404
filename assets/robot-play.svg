<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 142" role="img" aria-labelledby="title desc">
  <title id="title">Robot playing Pong</title>
  <desc id="desc">A small lavender pixel robot playing a terminal game of Pong.</desc>
  <style>
    .ball { animation: ball 2.4s linear infinite alternate; }
    .left { animation: paddle-left 2.4s ease-in-out infinite alternate; }
    .right { animation: paddle-right 2.4s ease-in-out infinite alternate; }
    .antenna { animation: signal 1.4s steps(2) infinite; }
    @keyframes ball { from { transform: translate(0, -14px); } to { transform: translate(76px, 17px); } }
    @keyframes paddle-left { from { transform: translateY(-8px); } to { transform: translateY(11px); } }
    @keyframes paddle-right { from { transform: translateY(12px); } to { transform: translateY(-10px); } }
    @keyframes signal { 50% { opacity: .28; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46 116h129" stroke="#30363D" stroke-width="5"/>

    <rect x="105" y="17" width="91" height="68" rx="6" fill="#0D1117" stroke="#8B5CF6" stroke-width="3"/>
    <path d="M112 31h77M150 25v54" stroke="#30363D" stroke-width="2" stroke-dasharray="3 5"/>
    <path class="left" d="M120 43v18" stroke="#C4B5FD" stroke-width="5"/>
    <path class="right" d="M181 43v18" stroke="#A78BFA" stroke-width="5"/>
    <circle class="ball" cx="126" cy="54" r="4" fill="#F0F6FC" stroke="none"/>
    <path d="M145 85l-8 17h27l-8-17" stroke="#6E7681" stroke-width="3"/>

    <path d="M59 32V20m0 0l9-8" stroke="#A78BFA" stroke-width="3"/>
    <circle class="antenna" cx="70" cy="10" r="5" fill="#C4B5FD" stroke="none"/>
    <rect x="27" y="31" width="65" height="48" rx="10" fill="#161B22" stroke="#8B5CF6" stroke-width="3"/>
    <rect x="35" y="39" width="49" height="29" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
    <rect x="44" y="49" width="7" height="7" rx="1" fill="#C4B5FD" stroke="none"/>
    <rect x="68" y="49" width="7" height="7" rx="1" fill="#C4B5FD" stroke="none"/>
    <path d="M53 61h13" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M40 80v27m39-27v27M40 92H27m52 0h18" stroke="#A78BFA" stroke-width="6"/>
    <path d="M30 110h21m17 0h21" stroke="#8B5CF6" stroke-width="7"/>
    <rect x="45" y="80" width="29" height="23" rx="4" fill="#2E1065" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M52 91h15M59.5 84v14" stroke="#C4B5FD" stroke-width="2"/>
  </g>
</svg>
