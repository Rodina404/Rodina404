    <stop offset="0" stop-color="#0B0E2A"/><stop offset="1" stop-color="#141A3D"/>
  </linearGradient>
  <radialGradient id="neb1" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="neb2" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#EC4899" stop-opacity=".22"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
    <stop offset=".45" stop-color="#E2E8F0" stop-opacity=".35"/><stop offset="1" stop-color="#E2E8F0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moonFace" cx=".35" cy=".35" r=".75">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E2E8F0"/><stop offset="1" stop-color="#A5B4CB"/>
  </radialGradient>
  <mask id="crescent">
    <circle cx="150" cy="120" r="52" fill="#fff"/>
    <circle cx="176" cy="104" r="48" fill="#000"/>
  </mask>
  <radialGradient id="planet" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#C4B5FD"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#3B1D8F"/>
  </radialGradient>
  <clipPath id="ringFront"><rect x="900" y="200" width="300" height="100"/></clipPath>
  <clipPath id="ringBack"><rect x="900" y="0" width="300" height="200"/></clipPath>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/>
  </linearGradient>
  <style>
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

    .shoot{animation:shoot 7s ease-in infinite;opacity:0}
    @keyframes shoot{0%,70%{transform:translate(0,0);opacity:0}72%{opacity:1}85%{transform:translate(420px,160px);opacity:0}100%{opacity:0}}
    .glow{animation:glow 5s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
  </style>
</defs>
