<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Rodina Konsowa, Applied AI Engineer, Cairo, Egypt">
<title>Rodina Konsowa, Applied AI Engineer</title>
<defs>
