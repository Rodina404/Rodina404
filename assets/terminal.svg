<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, IBM Plex Mono, SFMono-Regular, Consolas, Liberation Mono, monospace">
  <title id="title">Rodina Mohamed terminal introduction</title>
  <desc id="desc">A minimal terminal showing Rodina's name, role, and engineering focus.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#161B22"/><stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
  </defs>
  <style>
    .cursor { animation: blink 1.05s steps(1) infinite; }
    .prompt { fill: #A78BFA; }
    .command { fill: #F0F6FC; }
    .muted { fill: #8B949E; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x="1" y="1" width="1198" height="328" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <path d="M13 1h1174a12 12 0 0 1 12 12v42H1V13A12 12 0 0 1 13 1z" fill="url(#top)"/>
  <circle cx="31" cy="28" r="7" fill="#FF7B72"/><circle cx="55" cy="28" r="7" fill="#D29922"/><circle cx="79" cy="28" r="7" fill="#3FB950"/>
  <text x="600" y="34" text-anchor="middle" font-size="15" fill="#8B949E">rodina@github: ~</text>

  <g font-size="21">
    <text x="42" y="96" class="prompt">rodina@github:~$</text>
    <text x="262" y="96" class="command">whoami</text>

    <text x="42" y="139" font-size="30" font-weight="700" fill="#F0F6FC">Rodina Mohamed</text>

    <text x="42" y="190" class="prompt">rodina@github:~$</text>
    <text x="262" y="190" class="command">cat role.txt</text>
    <text x="42" y="228" font-size="20" fill="#C4B5FD">Software Development Engineer | AI Engineer</text>

    <text x="42" y="276" class="prompt">rodina@github:~$</text>
    <text x="262" y="276" class="command">focus --now</text>
    <text x="420" y="276" class="muted">agentic-ai / rag / backend-systems</text>
    <rect class="cursor" x="850" y="257" width="12" height="24" fill="#C4B5FD"/>
  </g>
</svg>
