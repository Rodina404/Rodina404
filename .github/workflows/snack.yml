name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Rodina404
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%238B5CF6&color_dots=%23F3F4F6,%23DDD6FE,%23C4B5FD,%23A78BFA,%237C3AED
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23C4B5FD&color_dots=%23171320,%232E1065,%235B21B6,%238B5CF6,%23C4B5FD

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
