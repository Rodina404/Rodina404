name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Rodina404
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23F59E0B&color_dots=%23EEF2FF,%23C7D2FE,%23A5B4FC,%236366F1,%23312E81
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FBBF24&color_dots=%230B0E2A,%23312E81,%236D28D9,%23A78BFA,%23E2E8F0

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
